# What every change has to pass, whoever wrote it. This is the gate the agent's
# own pull requests go through: it can open one, and this decides whether the
# branch is fit to merge.
#
# It runs `task check` rather than a copy of what that does, so the pipeline and
# the local command cannot drift apart.
#
# No secrets are available here on purpose. A pull request branch can change the
# code this workflow runs, so anything it could reach, a proposed change could
# reach. Deploying is a separate workflow, on main only.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Debian, because the image is Debian. The browser tools drive the chromium
    # the image installs, and on the Ubuntu runner `apt-get install chromium` is
    # a stub that installs the chromium *snap* — a different browser, under its
    # own confinement, which hangs where the Debian package renders. Testing
    # against it would be testing something the agent never runs. This container
    # shares the runner's kernel, so Landlock is still the host's.
    #
    # testenv/Dockerfile describes this same environment, which is where `task
    # check` runs when the host is not Linux. A change to one belongs in the
    # other.
    container:
      image: golang:1.25-bookworm
    steps:
      - uses: actions/checkout@v4

      # web/*.test.js runs under node's own test runner; there are no packages.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The tool sandbox on Linux is Landlock, which needs no package and no
      # sysctl: it is a kernel facility an unprivileged process asks for, so the
      # kernel this container shares with the runner is the one that answers.
      #
      # /sys/kernel/security is a host mount and is not in here, so this cannot
      # read the LSM list any more. It does not need to: whether anything is
      # actually confining a tool is settled by the suite, where every test that
      # needs confinement skips with its reason rather than passing against a
      # boundary that is not there. A green run with those skips in it is not the
      # same as a green run, and says so.
      - name: Report the sandbox
        run: |
          uname -r
          cat /sys/kernel/security/lsm 2>/dev/null \
            || echo "(the host's LSM list is not visible from inside the container)"

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # The checkout is owned by a different uid than the one running git here.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The same package the Dockerfile installs, to the same path the tools
      # look at. This was Playwright's headless shell, chosen when a full browser
      # bundle would not start under bubblewrap; Landlock replaced bubblewrap and
      # builds no mount namespace, so the bundle starts — and the cache, the
      # override variable, and the search that went with them are gone.
      - name: Install the browser and the rest of the userland
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            chromium curl wget python3 perl \
            poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu \
            python3-pip python3-venv python3-numpy python3-pil \
            unzip jq

      - name: Report the browser
        run: /usr/bin/chromium --version

      # gh and glab come from their own releases, the way the runtime image
      # fetches them rather than the way apt would. The userland test proves the
      # shell can run what the image ships, and it can only prove that where
      # they are. These versions are the ones Dockerfile pins, and
      # testenv/Dockerfile carries the same two lines; the three move together.
      - name: Install the forge clients
        env:
          GH_VERSION: 2.100.0
          GLAB_VERSION: 1.118.0
        run: |
          arch="$(dpkg --print-architecture)"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${arch}.tar.gz" \
            | tar -xz --strip-components=2 -C /usr/local/bin "gh_${GH_VERSION}_linux_${arch}/bin/gh"
          curl -fsSL "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${GLAB_VERSION}/glab_${GLAB_VERSION}_linux_${arch}.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin bin/glab

      - name: task check
        run: task check
