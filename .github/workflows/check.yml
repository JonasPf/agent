# What every change has to pass, whoever wrote it. This is the gate the agent's
# own pull requests go through: it can open one, and this decides whether the
# branch is fit to merge.
#
# It runs `task check` rather than a copy of what that does, so the pipeline and
# the local command cannot drift apart.
#
# No secrets are available here on purpose. A pull request branch can change the
# code this workflow runs, so anything it could reach, a proposed change could
# reach. Deploying is a separate workflow, on main only.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # web/*.test.js runs under node's own test runner; there are no packages.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The tool sandbox on Linux is bubblewrap, and the runner is Ubuntu 24.04,
      # which refuses unprivileged user namespaces — the same restriction that
      # keeps the sandbox off the deployment host (TODO.md), so the constraint is
      # Ubuntu's rather than that host's. Lifting it here is what makes the tool
      # subprocess tests run confined, instead of taking the unsandboxed path and
      # passing for the wrong reason.
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --tmpfs /tmp true
          echo "bubblewrap works"

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # The browser tools drive Chromium's headless shell, not a full browser
      # bundle — a bundle does not start under the sandbox, which is what the
      # runner was failing on. Locally the shell comes from a Playwright cache
      # that is already there; here it has to be fetched, into the same cache
      # the tools look in.
      - name: Install the headless browser
        run: npx --yes playwright install chromium-headless-shell

      - name: Report the browser
        run: ls ~/.cache/ms-playwright 2>/dev/null || echo "no playwright cache"

      - name: task check
        run: task check
