# What every change has to pass, whoever wrote it. This is the gate the agent's
# own pull requests go through: it can open one, and this decides whether the
# branch is fit to merge.
#
# It runs `task check` rather than a copy of what that does, so the pipeline and
# the local command cannot drift apart.
#
# No secrets are available here on purpose. A pull request branch can change the
# code this workflow runs, so anything it could reach, a proposed change could
# reach. Deploying is a separate workflow, on main only.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # web/*.test.js runs under node's own test runner; there are no packages.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The tool sandbox on Linux is Landlock, which needs no package and no
      # sysctl: it is a kernel facility an unprivileged process asks for. This
      # says which ABI the runner has, so a suite that ran unconfined is visible
      # as that rather than as a suite that passed.
      - name: Report the sandbox
        run: |
          grep -q landlock /sys/kernel/security/lsm && echo "landlock is enabled" || echo "NO LANDLOCK on this runner"
          cat /sys/kernel/security/lsm; uname -r

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # The same package the image installs, at the same path the tools look at.
      # This was Playwright's headless shell, chosen when a full browser bundle
      # would not start under bubblewrap; Landlock replaced bubblewrap and does
      # not build a mount namespace, so the bundle starts and the cache, the
      # override variable, and the search that went with them are gone.
      - name: Install the browser
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium

      - name: Report the browser
        run: /usr/bin/chromium --version

      - name: task check
        run: task check
