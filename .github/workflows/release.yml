# What happens once a change is merged: build the image, publish it, and tell
# the server to pull it.
#
# This is the only workflow with credentials, and it runs on main only — never
# on a pull request branch. That is what keeps the review gate real: a proposed
# change cannot reach the registry or the server until a person has merged it.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # Attach a protection rule to this environment in the repository settings to
    # require an approval before anything is deployed.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: the commit, which is what a rollback names, and latest, which
      # is what the server pulls.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy pulls the new image and restarts the service. The transcript,
      # jobs, and session files are on volumes, so the conversation survives it.
      # Without the secret set, the build still publishes and the deploy is
      # skipped rather than failing the run.
      - name: Deploy
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; the image is published and nothing was deployed."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

      - name: Say what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository_owner }}/agent:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
