version: '3'

# Every workflow in the repo. `task` on its own lists them.
#
# The agent is a Linux program and has one environment: the container. Anything
# that compiles, tests, or runs it goes through `on:linux`, which runs the work
# directly when the host is already Linux — CI, a Linux desktop, the test
# container itself — and otherwise builds testenv/ and runs it in there. So a
# laptop that is not Linux proves exactly what CI proves, rather than a subset
# of it with the parts it cannot reach quietly skipped.
#
# OPENROUTER_API_KEY is read from .env by the agent itself; the eval command
# needs it in the environment too, and dotenv puts it there.

dotenv: ['.env']

vars:
  ADDR: '{{.AGENT_ADDR | default ":7770"}}'
  BACKUPS: '.backups'
  # What the interface reports as the running version. The deployment tags
  # images by commit, so the version on screen is the one a rollback names; a
  # working tree with uncommitted changes says so rather than claiming the
  # commit it started from.
  VERSION:
    sh: 'git describe --always --dirty 2>/dev/null || echo dev'
  BUILT_AT:
    sh: 'date -u +%Y-%m-%dT%H:%M:%SZ'
  STAMP: '-X agent/internal/app.Version={{.VERSION}} -X agent/internal/app.BuiltAt={{.BUILT_AT}}'
  # docker where it is installed, podman otherwise. Every command the tasks use
  # means the same in both.
  CONTAINER:
    sh: 'command -v docker >/dev/null 2>&1 && echo docker || echo podman'

# A task named `x:here` is the work itself, run where the work belongs; `x` is
# what you type, and puts `x:here` on Linux. They carry no description, so the
# list above stays the set of things worth typing. build:tools, test:go, and
# test:web are the same: steps of a suite, not entry points.
tasks:
  default:
    desc: List the available tasks
    cmds: [task --list]
    silent: true

  build:
    desc: Compile the agent and every tool
    cmds:
      - task: on:linux
        vars: {CMD: 'task build:here'}

  build:here:
    cmds:
      - go build -ldflags '{{.STAMP}}' ./...
      - task: build:tools

  build:tools:
    silent: true
    cmds:
      - |
        set -e
        for d in tools/*/; do
          [ -f "$d/manifest.json" ] || continue
          go build -o "$d/run" "./$d"
        done
        echo "tools built"

  dev:
    desc: Run the agent, serving http://localhost{{.ADDR}} — the one way to run it
    cmds:
      # The sandbox is Landlock, which is the kernel's: a tool is confined where
      # the agent runs on Linux, and nowhere else. There is no second way to
      # start the agent, because there was no second environment worth
      # supporting — one that confined nothing, answered `-confine` with an
      # error, and skipped the tests that would have said so.
      #
      # The image keeps both under /app/state, which is the single volume a
      # deployment mounts. Here they are bound separately so a conversation
      # started in the container outlives it, at the repository root where the
      # db: tasks back it up and restore it.
      - '{{.CONTAINER}} build -t agent:dev --build-arg VERSION="{{.VERSION}}" --build-arg BUILT_AT="{{.BUILT_AT}}" .'
      # Docker creates a missing bind-mount source; Podman refuses to.
      - mkdir -p data workspace
      - |
        {{.CONTAINER}} run --rm -it \
          -p {{trimPrefix ":" .ADDR}}:7770 \
          -v "$PWD/data:/app/state/data" \
          -v "$PWD/workspace:/app/state/workspace" \
          --env-file .env \
          agent:dev

  fmt:
    desc: Format the Go sources in place
    cmds:
      - gofmt -w .

  lint:
    desc: Report unformatted files and vet problems
    cmds:
      - task: on:linux
        vars: {CMD: 'task lint:here'}

  lint:here:
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed:"; echo "$unformatted"; exit 1
        fi
      - go vet ./...

  test:
    desc: Run every test suite — Go (agent and tools) and the browser helpers
    cmds:
      - task: on:linux
        vars: {CMD: 'task test:here'}

  test:here:
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    deps: [build:tools]
    cmds:
      - go test ./...

  test:web:
    cmds:
      - node --test web/*.test.js

  check:
    desc: Everything that must pass before committing
    cmds:
      - task: on:linux
        vars: {CMD: 'task check:here'}

  check:here:
    cmds:
      - task: lint:here
      - task: build:here
      - task: test:here

  eval:
    desc: Put each tool's eval.json cases to a real model (costs money; CLI={{.CLI_ARGS}})
    cmds:
      - task: on:linux
        vars: {CMD: 'task eval:here -- {{.CLI_ARGS}}', ENV_FILE: '--env-file .env'}

  eval:here:
    # A case runs the tool it calls, and the registry will not load a tool whose
    # run is missing.
    deps: [build:tools]
    cmds:
      - go run ./cmd/eval {{.CLI_ARGS}}

  on:linux:
    internal: true
    cmds:
      # Already Linux — CI, a Linux desktop, or the test container running its
      # own tasks — so the work runs here. Nothing is gained by putting a Linux
      # kernel inside a Linux kernel, and CI has no container runtime to do it
      # with.
      #
      # Otherwise: the environment is built once and holds no source. The working
      # tree is mounted read-only and copied in, so the Linux executables a build
      # writes to tools/*/run never land in the tree. The Go caches outlive the
      # container, so a second run does not recompile everything. .env stays out
      # of the copy and out of the image; the evals are handed it at run time.
      - |
        if [ "$(uname -s)" = "Linux" ]; then
          exec sh -c '{{.CMD}}'
        fi
        set -e
        {{.CONTAINER}} build -q -t agent:test testenv
        {{.CONTAINER}} run --rm {{.ENV_FILE}} \
          -v "$PWD:/repo:ro" \
          -v agent-test-gomod:/go/pkg/mod \
          -v agent-test-gocache:/root/.cache/go-build \
          agent:test sh -c 'tar -C /repo -cf - \
            --exclude=./.git --exclude=./.backups --exclude=./data --exclude=./workspace \
            --exclude=./.env --exclude="./tools/*/run" . | tar -C /src -xf - && {{.CMD}}'

  db:clear:
    desc: Move sessions, jobs, and session files to a timestamped backup and start fresh
    silent: true
    cmds:
      - |
        set -e
        if lsof -ti tcp{{.ADDR}} >/dev/null 2>&1; then
          echo "The agent is running on {{.ADDR}}. Stop it first, then rerun." >&2
          exit 1
        fi
        stamp=$(date +%Y%m%d-%H%M%S)
        dest="{{.BACKUPS}}/$stamp"
        mkdir -p "$dest"
        # data/db moves whole, because the database and its journals have to
        # travel together: a write-ahead log parted from its database is worse
        # than no log at all. The bare data/agent.db is where the database lived
        # before it was given a directory of its own, and is moved too so a tree
        # the agent has not yet started against is also cleared.
        for f in data/sessions data/db data/agent.db data/agent.db-wal data/agent.db-shm; do
          [ -e "$f" ] && mv "$f" "$dest"/ || true
        done
        # Session working directories are session state too, and an orphaned one
        # outlives every record of what put it there.
        [ -d workspace ] && mv workspace "$dest"/workspace || true
        mkdir -p data/sessions workspace
        echo "backed up to $dest"

  db:restore:
    desc: Restore the most recent db:clear backup
    silent: true
    cmds:
      - |
        set -e
        latest=$(ls -1d {{.BACKUPS}}/*/ 2>/dev/null | tail -1)
        if [ -z "$latest" ]; then echo "no backups in {{.BACKUPS}}" >&2; exit 1; fi
        rm -rf data/sessions data/db data/agent.db data/agent.db-wal data/agent.db-shm workspace
        cp -R "$latest"/. data/
        if [ -d "data/workspace" ]; then mv data/workspace workspace; fi
        # A backup taken before the database had a directory of its own restores
        # as data/agent.db, and is left there: the agent moves it into place on
        # the next start, journals and all, rather than this doing it twice.
        echo "restored from $latest"

  db:status:
    desc: Count what the running agent currently holds
    silent: true
    cmds:
      - |
        base="http://localhost{{.ADDR}}"
        for r in sessions jobs dead-letters; do
          printf '%-14s ' "$r"
          curl -sf "$base/$r" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d) if d else 0)' \
            || echo "(agent not running)"
        done
        printf '%-14s ' tools
        curl -sf "$base/tools" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d["tools"]),"loaded, failures:",d.get("failures"))' 2>/dev/null || echo "-"

  tools:reload:
    desc: Ask the running agent to reload tools from disk
    cmds:
      - curl -fsS -X POST http://localhost{{.ADDR}}/tools/reload -o /dev/null -w 'reload %{http_code}\n'
