<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="breaker"></div>
<div id="shell">
  <aside class="side" id="side">
    <div class="side-head">
      <span class="brand"><span class="dot"></span>agent</span>
      <button class="icon" id="side-close" title="Close" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>
    <div class="side-actions">
      <button class="btn primary" id="side-new">New conversation</button>
      <button class="icon" id="side-search" title="Search transcripts" aria-label="Search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17"/></svg></button>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-label"><span>Conversations</span><span class="sp"></span><button id="side-all">all</button></div>
    <div class="side-list" id="side-list"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div id="scrim"></div>
  <div id="pane">
    <header>
      <button class="icon" id="menu" title="Conversations" aria-label="Conversations"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      <button class="icon" id="back" hidden aria-label="Back" title="Back"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4L6.5 10l6 6"/></svg></button>
      <div class="title" id="title">agent</div>
      <div class="head-acts" id="head-acts"></div>
      <div class="more-wrap" id="more-wrap" hidden>
        <button class="icon" id="more" title="Actions" aria-label="Actions"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.4" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1.4" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </header>
    <main id="main"><div class="wide" id="view"></div></main>
    <div id="foot"></div>
  </div>
</div>
<script src="/markdown.js"></script>
<script src="/transcript.js"></script>
<script src="/notify.js"></script>
<script src="/app.js"></script>
</body>
</html>
