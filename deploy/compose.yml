# The production deployment, as a Dokploy Compose application.
#
# Dokploy builds nothing here: the image is built by GitHub Actions on a push to
# main and pulled by tag. `docker compose pull && docker compose up -d` is the
# whole update, and that is what the deploy webhook triggers.
#
# The service publishes no host port. Traefik reaches it over dokploy-network,
# and the router that puts it behind a password is deploy/traefik/agent.yml.

services:
  agent:
    image: ghcr.io/${GH_OWNER:-jonaspf}/agent:${AGENT_TAG:-latest}
    restart: unless-stopped
    # A redeploy exists to pick up a new image, and compose will happily reuse a
    # cached one of the same name. Every deploy pulls.
    pull_policy: always
    environment:
      # Required. Dokploy holds it; it never enters the repository.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set this in Dokploy}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-sonnet-4.5}
      # This box has ~300 MB of memory free. A headless Chrome does not fit, so
      # web_fetch retrieves pages over plain HTTP instead of rendering them.
      AGENT_NO_BROWSER: "1"
      # What the agent needs to proposes changes to itself. Fine-grained, one
      # repository, contents + pull requests write, no workflow scope: the most
      # it can do with this is open a pull request nobody has merged yet.
      GH_TOKEN: ${GH_TOKEN:-}
      AGENT_REPO: ${AGENT_REPO:-}
    volumes:
      # Transcripts, jobs, memory, and the search index. Losing this loses the
      # agent's whole history, so it is a named volume and not a bind mount into
      # a directory a deploy might replace.
      - agent-data:/app/data
      # One working directory per session: what its tools see, and where a clone
      # of this repository lands while the agent is editing it.
      - agent-workspace:/app/workspace
    networks:
      - dokploy-network
    # Routing belongs with the deployment, not in a file placed on the server by
    # hand: Traefik watches this network for labels, so the route redeploys with
    # the app and is versioned with it.
    #
    # The hostname and the credential are not in this repository. Both come from
    # the environment where it is deployed — a bcrypt hash is a password with a
    # cost factor in front of it, and this repository is public.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.agent.loadbalancer.server.port=8080
      # http answers only to send the browser to https.
      - traefik.http.routers.agent-web.rule=Host(`${AGENT_HOST:?the hostname to serve on}`)
      - traefik.http.routers.agent-web.entrypoints=web
      - traefik.http.routers.agent-web.middlewares=redirect-to-https@file
      # The agent has no login of its own — one person, no accounts — so the
      # password lives here, in front of it.
      - traefik.http.routers.agent.rule=Host(`${AGENT_HOST:?the hostname to serve on}`)
      - traefik.http.routers.agent.entrypoints=websecure
      - traefik.http.routers.agent.tls.certresolver=letsencrypt
      - traefik.http.routers.agent.middlewares=agent-auth
      # Required, not optional: unset, this would interpolate to an empty user
      # list, and whether Traefik then fails the router closed or serves it open
      # is not a question worth having an answer to. Compose refuses to start.
      - traefik.http.middlewares.agent-auth.basicauth.users=${AGENT_BASIC_AUTH:?user:bcrypt-hash from htpasswd -nbB}
    # A single-user agent on a shared host. Without a limit one runaway tool
    # takes the machine down with it, and it is not the only service there.
    # mem_limit rather than deploy.resources, which is a swarm key that plain
    # docker compose — which is what Dokploy runs — ignores.
    mem_limit: 512m

volumes:
  agent-data:
  agent-workspace:

networks:
  dokploy-network:
    external: true
